name: Publish to npm

# Publishes through npm trusted publishing (OIDC). No npm token is stored.
# The npm package settings must list this repository and this workflow file
# (publish.yml) as a trusted publisher.
#
# Release a version in one of two ways:
# - Publish a GitHub release for a tag such as v1.2.1.
# - Run this workflow by hand and enter the tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v1.2.1"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # macOS: the native helper needs swiftc and codesign.
    runs-on: macos-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # prepublishOnly runs the full build, including the native helper.
      - name: Publish
        run: npm publish
